# =============================================================================================
# Logging quick reference
#
# Loaded by logging.config.fileConfig("loggin.conf") from the current directory - a script
# uses the loggin.conf of the directory it runs in (e.g. dtutest/loggin.conf).
#
# Levels, low to high:  DEBUG < INFO < WARNING < ERROR < CRITICAL
# A message is written only when it passes BOTH filters:
#   1. the logger level   ([logger_*] level=)   - drops lower messages for every handler
#   2. the handler level  ([handler_*] level=)  - drops lower messages for that output only
# So a DEBUG message needs DEBUG on the logger AND on the handler.
#
# Loggers (sources):
#   testLog    test scripts (dtutest/*.py) and ixia-script/ixia_stream.py
#              (IxiaPort actions, 'tclsh ...' lines and the Tcl output are DEBUG)
#   dtulibLog  library modules (dtuscript/, dtuscript.exaware/): the trace() / info() /
#              warn() / error() wrappers with the colored module prefix; trace() is DEBUG
#   deviceLog  raw CLI input/output of router_cisco.py and router_exaware.py - every
#              command sent and every response; ERROR hides it, INFO or DEBUG shows it
#   root       everything else, e.g. paramiko (SSH)
#
# Outputs (handlers):
#   toConsole  stderr, level INFO - DEBUG never reaches the console
#   toFile     logs/dtutest.log, level DEBUG, mode 'w' - truncated on every run
#
# Typical changes:
#   see every CLI byte         [logger_device]  level=DEBUG   (quiet: level=ERROR)
#   see IXIA tclsh calls       [logger_test]    level=DEBUG   (file only - console is INFO)
#   less library noise         [logger_dtulib]  level=INFO
#   DEBUG on the console too   [handler_toConsole] level=DEBUG
# =============================================================================================

[loggers]
keys=root,test,dtulib,device

[handlers]
keys=toFile,toConsole

[formatters]
keys=formConsole,formFile

# paramiko, ssh, all
[logger_root]
level=ERROR
handlers=toFile

# Logger for the tests
[logger_test]
level=INFO
handlers=toFile, toConsole
qualname=testLog
#propagate=1

# Logger for dtuscripts
[logger_dtulib]
level=DEBUG
# level=ERROR
handlers=toFile, toConsole
qualname=dtulibLog

# device output
[logger_device]
level=DEBUG
#level=ERROR
handlers=toFile, toConsole
qualname=deviceLog

[handler_toConsole]
class=StreamHandler
level=INFO
formatter=formConsole
#args=(sys.stdout,)

[handler_toFile]
class=FileHandler
level=DEBUG
formatter=formFile
args=('logs/dtutest.log', 'w')

[formatter_formConsole]
format=%(asctime)s %(levelname)s %(message)s
datefmt=
style=%
validate=True
class=logging.Formatter

[formatter_formFile]
format=%(asctime)s %(levelname)s %(message)s
datefmt=
style=%
validate=True
class=logging.Formatter